# AssistGen 上线演练编排（演示用，非真实生产环境）
#
#   最快路径 —— 只把依赖服务容器化，后端在宿主机按生产参数启动：
#       docker compose up -d
#       （然后在 llm_backend 目录执行：python -m uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1 --proxy-headers）
#
#   完整路径 —— 后端也进容器：
#       docker compose --profile full up -d --build
#       docker compose exec backend python scripts/init_db.py     # 仅空库首次执行（脚本含 drop_all）
#
#   再加反向代理 Nginx：
#       docker compose --profile full --profile proxy up -d --build
#
# 密钥来源：dashscope_agent/.env（compose 用它做变量插值，并作为 env_file 注入容器）。
# 下面的 environment 只做「覆盖」——把 .env 里面向宿主机的地址改成容器内服务名。

name: assistgen

services:
  # ---------------- 基础设施 ----------------
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-devpass}
      MYSQL_DATABASE: ${DB_NAME:-assist_gen}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # $$ 在 compose 里转义为字面量 $，实际执行时由容器内 shell 展开
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  # Neo4j 按需启用：不启用时应用仍能启动（检索/GraphRAG 相关功能不可用）
  neo4j:
    image: neo4j:5.26-community
    profiles: ["graph", "full"]
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4jdemo123}
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7474 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # ---------------- 应用 ----------------
  backend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖 .env 里面向宿主机的地址，改为容器网络内的服务名
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-devpass}
      DB_NAME: ${DB_NAME:-assist_gen}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-neo4jdemo123}
      # .env 里的 GRAPHRAG_* 相对路径是按 CWD=dashscope_agent 写的，容器 CWD 不同，必须改回来
      GRAPHRAG_PROJECT_DIR: app/graphrag
      GRAPHRAG_DATA_DIR: data
      # 密钥仍是示例值时应用只告警不退出，这里显式兜底避免演示时踩坑
      SECRET_KEY: ${SECRET_KEY:-please-change-this-to-a-random-32-byte-secret}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # 上传文件与 GraphRAG 索引必须落盘持久化，否则容器重建即丢失
      - uploads_data:/app/dashscope_agent/llm_backend/uploads
      - graphrag_data:/app/dashscope_agent/llm_backend/app/graphrag/data
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ---------------- 反向代理（可选）----------------
  nginx:
    image: nginx:1.27-alpine
    profiles: ["proxy", "full"]
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
  neo4j_data:
  uploads_data:
  graphrag_data:
