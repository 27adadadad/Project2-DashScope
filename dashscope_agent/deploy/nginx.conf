# AssistGen 反向代理（演示用，HTTP 版本；真实生产应在此终止 TLS）
#
# 关键点：本项目 /api/chat、/api/reason、/api/search 都是 text/event-stream（SSE），
# 反向代理必须关闭缓冲，否则增量内容会被 Nginx 攒着一次性下发，前端看起来「卡住不出字」。

upstream assistgen_backend {
    server backend:8000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # 上传接口需要放行较大的请求体
    client_max_body_size 50m;

    # 存活 / 就绪探针直通，供负载均衡或编排系统使用
    location = /health {
        proxy_pass http://assistgen_backend;
    }
    location = /ready {
        proxy_pass http://assistgen_backend;
    }

    location / {
        proxy_pass http://assistgen_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：关缓冲 + 放宽超时
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
